[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ssl-medical-vision-simclr"
version = "0.1.0"
description = "Self-Supervised Contrastive Learning (SimCLR) on Medical X-Rays with MLOps Pipeline"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2.0"
torchvision = "^0.17.0"
lightning = "^2.2.0"
hydra-core = "^1.3.2"
wandb = "^0.16.0"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
dvc = "^3.45.0"
pillow = "^10.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.0"
jupyter = "^1.0.0"

[tool.ruff]
line-length = 88
target-version = "py310"